[project]
name = "wcag-agent-eval"
version = "0.1.0"
description = "Dual-evaluation framework measuring WCAG compliance impact on AI agent performance"
requires-python = ">=3.11"
dependencies = [
    # Browser automation & accessibility auditing
    "playwright>=1.40.0",

    # Data & statistical analysis
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.25.0",

    # Visualization
    "matplotlib>=3.8.0",

    # LLM API client (agent execution) & robots.txt gate
    "httpx>=0.25.0",

    # Dataset construction utilities
    "pyyaml>=6.0",
    "tranco>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
